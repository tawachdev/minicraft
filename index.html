<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MiniCraft</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script type="module" crossorigin src="./assets/index-PY3QfRgH.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-gaXtCATU.css">
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="crosshair"></div>
      <div id="hearts-slot"></div>
      <div id="hotbar"></div>
      <div id="debug"></div>
    </div>

    <!-- Touch controls (mobile only) -->
    <div id="touch" class="hidden">
      <div id="joy-base"><div id="joy-stick"></div></div>
      <div id="touch-actions">
        <button id="btn-jump" class="tbtn">JUMP</button>
        <button id="btn-break" class="tbtn danger">BREAK</button>
        <button id="btn-place" class="tbtn ok">PLACE</button>
      </div>
    </div>

    <!-- Start / pause overlay -->
    <div id="overlay">
      <div class="panel">
        <h1>MINI<span>CRAFT</span></h1>
        <p class="tagline">A voxel sandbox</p>
        <div class="modes">
          <button id="mode-creative" class="mode active">CREATIVE</button>
          <button id="mode-survival" class="mode">SURVIVAL</button>
        </div>
        <button id="play">Click to Play</button>
        <ul class="controls">
          <li><b>WASD</b> move</li>
          <li><b>Space</b> jump</li>
          <li><b>Mouse</b> look</li>
          <li><b>Left click</b> break</li>
          <li><b>Right click</b> place</li>
          <li><b>1–9</b> select block</li>
          <li><b>Esc</b> pause</li>
        </ul>
      </div>
    </div>

  </body>
</html>
